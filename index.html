<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Site oficial do ONDE — Seu mapa de lugares, disponível para iPhone.">
  <meta name="theme-color" content="#e8f8f5">
  <title>ONDE — Seu mapa de lugares</title>
  <style>
    :root{color-scheme:light;--navy:#09294b;--teal:#05b8bc;--muted:#5e727f}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#effbf6,#ddf7f6 65%,#f7fbfe);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column}
    main{max-width:720px;width:100%;margin:auto;padding:64px 24px;text-align:center}
    .logo{font-size:clamp(5rem,17vw,8rem);font-weight:850;letter-spacing:-.085em;line-height:1}.logo span{color:var(--teal)}
    h1{font-size:clamp(1.5rem,5vw,2.5rem);letter-spacing:-.04em;margin:28px 0 10px}
    p{font-size:1.1rem;line-height:1.6;color:var(--muted)}
    .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
    a.btn{display:inline-block;padding:14px 20px;border:1px solid var(--navy);border-radius:14px;text-decoration:none;color:var(--navy);font-weight:650;background:#fff}
    a.btn.primary{background:var(--navy);color:#fff}
    footer{text-align:center;font-size:.86rem;padding:28px;color:var(--muted)}footer a{color:var(--navy)}
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-label="onde">onde<span>.</span></div>
    <h1>Seu mapa de lugares.</h1>
    <p>Descubra e salve os lugares que você encontrou em fotos, prints e links. Transforme inspirações em um mapa pessoal.</p>
    <div class="links">
      <a class="btn primary" href="https://apps.apple.com/br/app/id6826021580">Ver na App Store</a>
      <a class="btn" href="https://mtitton.github.io/onde-privacy/">Política de Privacidade</a>
    </div>
  </main>
  <footer>© 2026 Marcus Titton · <a href="mailto:mvtitton@gmail.com">Contato</a></footer>
</body>
</html>
